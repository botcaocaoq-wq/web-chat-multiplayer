<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phòng WebRTC Live & Screen Share - Index2</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #222; color: #fff; }
        #giao-dien-tong { display: flex; flex-direction: row; gap: 20px; align-items: flex-start; max-width: 1100px; }
        
        #khoi-chat-chinh { width: 422px; }
        #khung-chat { width: 400px; height: 350px; border: 1px solid #555; background: #333; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        
        #vung-nhap { display: flex; width: 422px; gap: 5px; align-items: center; margin-bottom: 8px; }
        #o-nhap { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #555; background: #444; color: white; border-radius: 4px; }
        #nut-chon-anh { padding: 8px 12px; font-size: 18px; background: #555; color: white; border: none; border-radius: 4px; cursor: pointer; display: block; }
        #nut-gui { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007acc; color: white; border: none; border-radius: 4px; }
        #nut-xoa-man-hinh { padding: 10px 12px; font-size: 16px; background: #e53935; color: white; border: none; border-radius: 4px; cursor: pointer; aspect-ratio: 1/1; }

        #vung-chuc-nang-camera { margin-bottom: 10px; width: 422px; display: flex; gap: 5px; }
        .nut-cam-share { flex: 1; padding: 12px; font-size: 14px; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        #nut-cong-tac-cam { background: #00897b; }
        #nut-cong-tac-share { background: #3949ab; }

        /* Khối chứa lưới camera/màn hình WebRTC */
        #khoi-camera-phu { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 10px; 
            width: 500px; 
            background: #333; 
            border: 1px solid #555; 
            padding: 10px; 
            border-radius: 4px;
            min-height: 200px;
        }
        
        .o-chua-cam-don { position: relative; background: #000; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; }
        
        /* 🛠️ SỬA CHÍNH XÁC: Thay vì thẻ ảnh <img>, WebRTC bắt buộc chạy bằng thẻ <video> trực tiếp để chạy realtime không delay */
        .video-stream-cam { width: 100%; height: 200px; object-fit: cover; background: #111; }
        .lat-guong { transform: scaleX(-1); } 
        .nhan-ten-cam { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.6); padding: 2px 6px; font-size: 12px; border-radius: 3px; color: #fff; }

        #vung-tai-khoan { width: 422px; display: flex; gap: 5px; margin-bottom: 8px; }
        .o-dang-nhap { flex: 1; padding: 8px 10px; font-size: 14px; border: 1px solid #555; background: #444; color: white; border-radius: 4px; }
        #nut-xac-thuc { padding: 8px 12px; font-size: 14px; background: #4caf50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #nut-doi-tk { padding: 8px 12px; font-size: 14px; background: #ff9800; color: black; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; display: none; width: 422px; margin-bottom: 8px; }
        
        .tin-nhan { margin: 5px 0; padding: 5px; background: #444; border-radius: 3px; word-break: break-word; }
        .anh-chat { max-width: 320px; max-height: 320px; border-radius: 5px; margin-top: 5px; display: block; object-fit: contain; }
        .link-lien-ket { color: #2196f3; text-decoration: underline; font-weight: bold; }
        #nut-xin-quyen { margin-bottom: 10px; padding: 10px; background: #ff9800; border: none; color: black; font-weight: bold; cursor: pointer; border-radius: 4px; width: 422px; }

        @media (max-width: 950px) {
            #giao-dien-tong { flex-direction: column !important; width: 100% !important; gap: 15px; }
            #khoi-chat-chinh, #vung-nhap, #vung-tai-khoan, #nut-doi-tk, #nut-xin-quyen, #vung-chuc-nang-camera { width: 100% !important; max-width: 422px; }
            #khung-chat { width: calc(100% - 22px) !important; max-width: 400px; }
            #khoi-camera-phu { width: calc(100% - 22px) !important; max-width: 400px; grid-template-columns: repeat(2, 1fr) !important; }
            .video-stream-cam { height: 140px !important; } 
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <h3>PHÒNG CHAT MULTIPLAYER - WEBRTC LIVE & SCREEN SHARE (INDEX2)</h3>
    
    <button id="nut-xin-quyen" onclick="kichHoatChayNgam()">🔔 KÍCH HOẠT NHẬN THÔNG BÁO KHI TẮT WEB</button>
    
    <div id="vung-chuc-nang-camera">
        <button id="nut-cong-tac-cam" class="nut-cam-share" onclick="xuLyCongTacCamera()">📷 BẬT CAMERA</button>
        <button id="nut-cong-tac-share" class="nut-cam-share" onclick="xuLyCongTacScreenShare()">🖥️ CHIA SẺ MÀN HÌNH</button>
    </div>

    <div id="giao-dien-tong">
        <div id="khoi-chat-chinh">
            <div id="khung-chat"></div>
            <div id="vung-nhap">
                <input type="text" id="o-nhap" placeholder="Nhập tin nhắn hoặc dán link video..." autocomplete="off" disabled>
                <button id="nut-chon-anh" type="button" onclick="kichHoatOChonAnh()" disabled>📎</button>
                <input type="file" id="o-chon-anh" accept="image/*" onchange="guiAnhTuDong(this)">
                <button id="nut-gui" onclick="guiTinNhan()" disabled>Gửi</button>
                <button id="nut-xoa-man-hinh" onclick="xoaSachManHinhTroChuyen()">🧹</button>
            </div>
            <div id="vung-tai-khoan">
                <input type="text" id="o-ten" class="o-dang-nhap" placeholder="Nhập Nickname..." autocomplete="off">
                <input type="password" id="o-mat-khau" class="o-dang-nhap" placeholder="Mật khẩu..." autocomplete="off">
                <button id="nut-xac-thuc" onclick="xuLyXacThucTaiKhoan()">Vào Phòng</button>
            </div>
            <button id="nut-doi-tk" onclick="xuLyDoiTaiKhoan()">🔄 ĐỔI TÀI KHOẢN KHÁC</button>
        </div>

        <!-- Khối lưới chứa video WebRTC -->
        <div id="khoi-camera-phu"></div>
    </div>
    <script>
        const socket = io();
        const khungChat = document.getElementById('khung-chat');
        const oNhap = document.getElementById('o-nhap');
        const oTen = document.getElementById('o-ten');
        const oMatKhau = document.getElementById('o-mat-khau');
        const vungTaiKhoan = document.getElementById('vung-tai-khoan');
        const nutDoiTk = document.getElementById('nut-doi-tk');
        let daDangNhapThanhCong = false;

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('saved_username') && localStorage.getItem('saved_password')) {
                oTen.value = localStorage.getItem('saved_username');
                oMatKhau.value = localStorage.getItem('saved_password');
                xuLyXacThucTaiKhoan(); 
            }
            let mocThoiGianAn = parseInt(localStorage.getItem('moc_thoi_gian_an_tin_nhan')) || 0;
            let lichSuNoiBo = JSON.parse(localStorage.getItem('lichSuChat_Local')) || [];
            lichSuNoiBo.forEach(data => {
                if (data.thoiGian > mocThoiGianAn) hienThiTinNhanLenKhungChat(data);
            });
        });

        function xuLyXacThucTaiKhoan() {
            const ten = oTen.value.trim();
            const matKhau = oMatKhau.value;
            if(!ten || !matKhau) {
                alert("Vui lòng nhập đầy đủ cả Tên đăng nhập và Mật khẩu!");
                return;
            }
            socket.emit('dang_nhap_he_thong', { ten: ten, matKhau: matKhau }, (res) => {
                if (res.success) {
                    daDangNhapThanhCong = true;
                    oNhap.disabled = false;
                    document.getElementById('nut-chon-anh').disabled = false;
                    document.getElementById('nut-gui').disabled = false;
                    localStorage.setItem('saved_username', ten);
                    localStorage.setItem('saved_password', matKhau);
                    vungTaiKhoan.style.display = 'none';
                    nutDoiTk.style.display = 'block';
                    socket.emit('lay_lich_su_khi_vao_sau');
                } else { alert(res.msg); }
            });
        }

        function xuLyDoiTaiKhoan() {
            if(confirm("Bạn có chắc muốn đổi tài khoản không?")) {
                daDangNhapThanhCong = false;
                tatHarnCameraPhanCung(); 
                oNhap.disabled = true;
                document.getElementById('nut-chon-anh').disabled = true;
                document.getElementById('nut-gui').disabled = true;
                oNhap.value = "";
                localStorage.removeItem('saved_username'); localStorage.removeItem('saved_password');
                oTen.value = ""; oMatKhau.value = "";
                vungTaiKhoan.style.display = 'flex'; nutDoiTk.style.display = 'none';
            }
        }

        socket.on('tra_lich_su_cho_nguoi_moi', function(mangTinNhan) {
            khungChat.innerHTML = ""; 
            let mocThoiGianAn = parseInt(localStorage.getItem('moc_thoi_gian_an_tin_nhan')) || 0;
            let lichSuLuuLocal = [];
            mangTinNhan.forEach(data => {
                if (data.thoiGian > mocThoiGianAn) hienThiTinNhanLenKhungChat(data);
                lichSuLuuLocal.push(data);
            });
            localStorage.setItem('lichSuChat_Local', JSON.stringify(lichSuLuuLocal));
        });

        async function kichHoatChayNgam() {
            if ('serviceWorker' in navigator && 'PushManager' in window) {
                try {
                    const reg = await navigator.serviceWorker.register('/sw.js');
                    const permission = await Notification.requestPermission();
                    if (permission !== 'granted') { return; }
                    const response = await fetch('/vapid-public-key');
                    const publicKey = await response.text();
                    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: publicKey });
                    await fetch('/luu-thong-bao', { method: 'POST', body: JSON.stringify(sub), headers: { 'Content-Type': 'application/json' } });
                    alert('Kích hoạt chạy ngầm thành công!');
                    document.getElementById('nut-xin-quyen').style.display = 'none';
                } catch (error) { console.error(error); }
            }
        }

        function guiTinNhan() {
            let noiDung = oNhap.value.trim();
            if (noiDung !== "") {
                socket.emit('gui_tin_nhan_mau', { loai: 'chu', ten: oTen.value.trim(), chu: noiDung });
                oNhap.value = ""; oNhap.focus();
            }
        }

        function kichHoatOChonAnh() { document.getElementById('o-chon-anh').click(); }

        function guiAnhTuDong(input) {
            if (input.files && input.files) {
                const file = input.files;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                        canvas.width = 500; canvas.height = img.height * (500 / img.width);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6); 
                        socket.emit('gui_tin_nhan_mau', { loai: 'anh', ten: oTen.value.trim(), chu: compressedBase64 });
                        input.value = ""; 
                    };
                };
                reader.readAsDataURL(file);
            }
        }

        function xoaSachManHinhTroChuyen() {
            if(confirm("Bạn có chắc muốn xóa toàn bộ tin nhắn ở phía bạn không?")) {
                khungChat.innerHTML = ""; localStorage.removeItem('lichSuChat_Local'); 
                localStorage.setItem('moc_thoi_gian_an_tin_nhan', Date.now().toString());
            }
        }

        oNhap.addEventListener("keypress", function(event) { if (event.key === "Enter") { guiTinNhan(); } });

        function taoNoiDungTinNhanHtml(chu) {
            const bieuThucLink = /(https?:\/\/[^\s]+)/g; const cacLink = chu.match(bieuThucLink);
            if (cacLink) {
                let linkGoc = cacLink;
                if (linkGoc.includes('youtube.com') || linkGoc.includes('youtu.be') || linkGoc.includes('tiktok.com')) {
                    return `<a href="${linkGoc}" target="_blank" class="link-lien-ket">Bấm vào để xem video 🎬</a>`;
                }
            }
            return ""; 
        }
        // 🛠️ MỚI 100% WEBRTC P2P: Cấu hình hệ thống kết nối trực tiếp, độ trễ bằng 0
        let luongCamHardware = null;
        let loaiHinhDangStream = "cam"; 
        let peerConnections = {}; // Lưu danh sách kết nối RTC với từng người { idSocket: RTCPeerConnection }
        
        // Máy chủ STUN miễn phí của Google để dò tìm địa chỉ IP bắt tay giữa 2 máy khách
        const rtcConfig = { iceServers: [{ urls: 'stun:://google.com' }] };
        
        const khoiCameraPhu = document.getElementById('khoi-camera-phu');
        const videoAoHardware = document.getElementById('video-ao-hardware');
        const nutCongTacCam = document.getElementById('nut-cong-tac-cam');
        const nutCongTacShare = document.getElementById('nut-cong-tac-share');

        async function xuLyCongTacCamera() {
            if (!daDangNhapThanhCong) return alert("Vui lòng đăng nhập trước!");
            if (luongCamHardware) { tatHarnCameraPhanCung(); socket.emit('chu_dong_tat_camera_server'); } 
            else {
                socket.emit('xin_phep_bat_camera_server', { ten: oTen.value.trim() }, async (res) => {
                    if (res.allowed) {
                        try {
                            loaiHinhDangStream = "cam";
                            luongCamHardware = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                            videoAoHardware.srcObject = luongCamHardware;
                            capNhatTrangThaiNutBam(true, false);
                            
                            // Tạo ô video cho chính mình cục bộ trước
                            capNhatHoacTaoOVideo(socket.id, oTen.value.trim() + " (Bạn)", luongCamHardware, "cam");
                            // Kích hoạt gửi tín hiệu bắt tay WebRTC đến toàn bộ phòng chat
                            thongBaoKetNoiWebRtcVoiMoiNguoi();
                        } catch (err) { alert("Không thể mở Cam!"); socket.emit('chu_dong_tat_camera_server'); }
                    } else { alert(res.msg); }
                });
            }
        }

        async function xuLyCongTacScreenShare() {
            if (!daDangNhapThanhCong) return alert("Vui lòng đăng nhập trước!");
            if (luongCamHardware) { tatHarnCameraPhanCung(); socket.emit('chu_dong_tat_camera_server'); } 
            else {
                socket.emit('xin_phep_bat_camera_server', { ten: oTen.value.trim() }, async (res) => {
                    if (res.allowed) {
                        try {
                            loaiHinhDangStream = "share";
                            // WebRTC truyền toàn bộ góc nhìn màn hình hệ thống, ẩn tab hay mở app khác vẫn quay được
                            luongCamHardware = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
                            videoAoHardware.srcObject = luongCamHardware;
                            capNhatTrangThaiNutBam(false, true);
                            
                            capNhatHoacTaoOVideo(socket.id, oTen.value.trim() + " [Màn hình]", luongCamHardware, "share");
                            thongBaoKetNoiWebRtcVoiMoiNguoi();

                            luongCamHardware.getVideoTracks()[0].onended = () => {
                                tatHarnCameraPhanCung(); socket.emit('chu_dong_tat_camera_server');
                            };
                        } catch (err) { alert("Không thể Share màn hình!"); socket.emit('chu_dong_tat_camera_server'); }
                    } else { alert(res.msg); }
                });
            }
        }

        function tatHarnCameraPhanCung() {
            if (luongCamHardware) { luongCamHardware.getTracks().forEach(track => track.stop()); luongCamHardware = null; }
            videoAoHardware.srcObject = null;
            xoaOVideoKhoiGiaoDien(socket.id);
            capNhatTrangThaiNutBam(false, false);
            
            // Đóng sạch tất cả các cổng kết nối WebRTC trực tiếp đang mở
            Object.keys(peerConnections).forEach(id => {
                peerConnections[id].close();
                delete peerConnections[id];
            });
        }

        function capNhatTrangThaiNutBam(isCamActive, isShareActive) {
            if (isCamActive) {
                nutCongTacCam.innerText = "🛑 TẮT CAMERA"; nutCongTacCam.style.background = "#d32f2f"; nutCongTacShare.disabled = true;
            } else if (isShareActive) {
                nutCongTacShare.innerText = "🛑 TẮT CHIA SẺ"; nutCongTacShare.style.background = "#d32f2f"; nutCongTacCam.disabled = true;
            } else {
                nutCongTacCam.innerText = "📷 BẬT CAMERA"; nutCongTacCam.style.background = "#00897b"; nutCongTacCam.disabled = false;
                nutCongTacShare.innerText = "🖥️ CHIA SẺ MÀN HÌNH"; nutCongTacShare.style.background = "#3949ab"; nutCongTacShare.disabled = false;
            }
        }

        // Tạo cấu hình kết nối trực tiếp Peer-To-Peer giữa máy mình và một máy ID Socket cụ thể
        function khoiTaoNgoiKetNoiWebRtc(idSocketNguoiKia, tenNguoiKia, isCaller) {
            const pc = new RTCPeerConnection(rtcConfig);
            peerConnections[idSocketNguoiKia] = pc;

            // Đổ luồng camera/màn hình của máy mình vào đường ống dẫn sang người kia
            if (luongCamHardware) {
                luongCamHardware.getTracks().forEach(track => pc.addTrack(track, luongCamHardware));
            }

            // Lắng nghe luồng dữ liệu video nhị phân từ máy người kia truyền ngược lại vào đường ống
            pc.ontrack = (event) => {
                capNhatHoacTaoOVideo(idSocketNguoiKia, tenNguoiKia, event.streams[0], "cam");
            };

            // Tìm kiếm đường đi mạng internet ngắn nhất giữa 2 máy (ICE Candidate)
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('rtc_tin_hieu_chuyen_tiep', { to: idSocketNguoiKia, type: 'candidate', candidate: event.candidate });
                }
            };

            // Nếu mình là người chủ động gọi (bật cam trước), tạo lời mời bắt tay (Offer)
            if (isCaller) {
                pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
                    socket.emit('rtc_tin_hieu_chuyen_tiep', { to: idSocketNguoiKia, type: 'offer', sdp: pc.localDescription });
                });
            }
            return pc;
        }

        function thongBaoKetNoiWebRtcVoiMoiNguoi() {
            // Khi mình bật cam, thông báo cho server để kích hoạt các máy khác mở đường ống RTC đón nhận luồng phát
            // Quá trình bắt tay sẽ chạy tự động thông qua sự kiện 'co_nguoi_vua_bat_camera'
        }

        function capNhatHoacTaoOVideo(idSocket, ten, luongStreamMedia, loaiStream = "cam") {
            let oCamDan = document.getElementById(`cam-${idSocket}`);
            if (!oCamDan) {
                oCamDan = document.createElement('div'); oCamDan.id = `cam-${idSocket}`; oCamDan.className = 'o-chua-cam-don';
                let lopGương = loaiStream === "cam" ? "video-stream-cam lat-guong" : "video-stream-cam";
                oCamDan.innerHTML = `<video id="vdo-${idSocket}" class="${lopGương}" autoplay playsinline></video><div class="nhan-ten-cam">${ten}</div>`;
                khoiCameraPhu.appendChild(oCamDan);
            }
            const videoThe = document.getElementById(`vdo-${idSocket}`);
            if (videoThe && luongStreamMedia) videoThe.srcObject = luongStreamMedia;
        }

        function xoaOVideoKhoiGiaoDien(idSocket) {
            const oCamDan = document.getElementById(`cam-${idSocket}`); if (oCamDan) oCamDan.remove();
            if (peerConnections[idSocket]) { peerConnections[idSocket].close(); delete peerConnections[idSocket]; }
        }

        // LẮNG NGHE LỆNH SERVER: Máy chủ thông báo có luồng phát mới để bắt tay WebRTC
        socket.on('co_nguoi_vua_bat_camera', function(data) {
            if (data.idSocket !== socket.id) {
                // Mình mở kết nối RTC với người vừa bật cam
                khoiTaoNgoiKetNoiWebRtc(data.idSocket, data.ten, luongCamHardware ? true : false);
            }
        });

        // HẬU TRƯỜNG BẮT TAY: Xử lý giải mã Offer / Answer / ICE Candidate đi qua đường ống trung chuyển server
        socket.on('rtc_tin_hieu_nhan_ve', function(data) {
            let pc = peerConnections[data.sender];
            
            if (data.type === 'offer') {
                if (!pc) pc = khoiTaoNgoiKetNoiWebRtc(data.sender, "Người chơi", false);
                pc.setRemoteDescription(new RTCSessionDescription(data.sdp))
                  .then(() => pc.createAnswer())
                  .then(answer => pc.setLocalDescription(answer))
                  .then(() => {
                      socket.emit('rtc_tin_hieu_chuyen_tiep', { to: data.sender, type: 'answer', sdp: pc.localDescription });
                  });
            } else if (data.type === 'answer' && pc) {
                pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
            } else if (data.type === 'candidate' && pc) {
                pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(e => console.error(e));
            }
        });

        socket.on('co_nguoi_vua_tat_camera', function(data) { xoaOVideoKhoiGiaoDien(data.idSocket); });
        socket.on('dong_bo_tat_ca_camera_hieng_tai', function(danhSachCam) {
            khoiCameraPhu.innerHTML = "";
            Object.keys(danhSachCam).forEach(idSock => {
                if (idSock !== socket.id) khoiTaoNgoiKetNoiWebRtc(idSock, danhSachCam[idSock], false);
            });
        });

        function hienThiTinNhanLenKhungChat(data) {
            let dongTinNhan = document.createElement('div'); dongTinNhan.className = 'tin-nhan';
            if (data.loai === 'chu') {
                let theLinkHtml = taoNoiDungTinNhanHtml(data.chu);
            if (theLinkHtml !== "") {
                dongTinNhan.innerHTML = `<strong>${data.ten}:</strong> ${theLinkHtml}`;
            } else {
                dongTinNhan.innerHTML = `<strong>${data.ten}:</strong> <span></span>`;
                dongTinNhan.querySelector('span').innerText = data.chu;
            }
        } else if (data.loai === 'anh') {
            dongTinNhan.innerHTML = `<strong>${data.ten}:</strong><img src="${data.chu}" class="anh-chat"/>`;
        }
        khungChat.appendChild(dongTinNhan); 
        khungChat.scrollTop = khungChat.scrollHeight;
    }

    socket.on('tin_nhan_moi_tu_server', function(data) {
        let mocThoiGianAn = parseInt(localStorage.getItem('moc_thoi_gian_an_tin_nhan')) || 0;
        if (data.thoiGian > mocThoiGianAn) hienThiTinNhanLenKhungChat(data);
        let lichSuNoiBo = JSON.parse(localStorage.getItem('lichSuChat_Local')) || []; 
        lichSuNoiBo.push(data);
        if (lichSuNoiBo.length > 50) lichSuNoiBo.shift();
        localStorage.setItem('lichSuChat_Local', JSON.stringify(lichSuNoiBo));
    });

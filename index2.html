<script>
(function () {
    const style = document.createElement("style");

    style.textContent = `
        #nut-avatar {
            padding: 8px 12px;
            font-size: 18px;
            background: #555;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #nut-avatar:hover {
            background: #666;
        }

        .avatar-chat {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            vertical-align: middle;
            margin-right: 6px;
            background: white;
            border: 1px solid #777;
        }

        .ten-nguoi-chat {
            display: inline-flex;
            align-items: center;
            font-weight: bold;
        }
    `;

    document.head.appendChild(style);

    const inputAvatar = document.createElement("input");

    inputAvatar.type = "file";
    inputAvatar.accept = "image/*";
    inputAvatar.style.display = "none";
    inputAvatar.id = "o-chon-avatar";

    document.body.appendChild(inputAvatar);

    const nutXoa =
        document.getElementById("nut-xoa-man-hinh");

    const nutAvatar =
        document.createElement("button");

    nutAvatar.id = "nut-avatar";
    nutAvatar.type = "button";
    nutAvatar.title = "Đổi avatar";
    nutAvatar.innerHTML = "👤";

    if (nutXoa) {
        nutXoa.parentNode.insertBefore(
            nutAvatar,
            nutXoa.nextSibling
        );
    }

    function avatarMacDinh() {
        return "data:image/svg+xml;charset=UTF-8," +
            encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 100 100">
                    <rect width="100" height="100" fill="white"/>
                    <circle cx="50" cy="35" r="18" fill="#999"/>
                    <path d="M20 85c2-20 15-30 30-30s28 10 30 30z"
                          fill="#999"/>
                </svg>
            `);
    }

    function keyAvatar(ten) {
        return "chatwold_avatar_" + ten;
    }

    function layAvatar(ten) {
        if (!ten) return avatarMacDinh();

        return localStorage.getItem(keyAvatar(ten))
            || avatarMacDinh();
    }

    function hienThiAvatar(data) {
        const khung =
            document.getElementById("khung-chat");

        if (!khung) return;

        const mocAn =
            parseInt(
                localStorage.getItem(
                    "moc_thoi_gian_an_tin_nhan"
                )
            ) || 0;

        if (data.thoiGian < mocAn) return;

        const div =
            document.createElement("div");

        div.className = "tin-nhan";

        const strong =
            document.createElement("strong");

        strong.className = "ten-nguoi-chat";

        const avatar =
            document.createElement("img");

        avatar.className = "avatar-chat";

        avatar.src =
            data.avatar ||
            avatarMacDinh();

        strong.appendChild(avatar);

        strong.appendChild(
            document.createTextNode(data.ten + ":")
        );

        div.appendChild(strong);
        div.appendChild(
            document.createTextNode(" ")
        );

        if (data.loai === "image") {

            const img =
                document.createElement("img");

            img.src = data.noiDung;
            img.className = "anh-chat";

            div.appendChild(img);

        } else {

            const span =
                document.createElement("span");

            span.innerText = data.noiDung;

            div.appendChild(span);
        }

        khung.appendChild(div);

        khung.scrollTop =
            khung.scrollHeight;
    }

    function guiTinNhanAvatar() {

        const oNhap =
            document.getElementById("o-nhap");

        const oTen =
            document.getElementById("o-ten");

        if (!oNhap || !oTen) return;

        const noiDung =
            oNhap.value.trim();

        const ten =
            oTen.value.trim();

        if (!noiDung || !ten) return;

        const msg = {
            ten: ten,
            loai: "text",
            noiDung: noiDung,
            thoiGian: Date.now(),
            avatar: layAvatar(ten)
        };

        socket.emit(
            "gui_tin_nhan_server",
            msg
        );

        hienThiAvatar(msg);

        oNhap.value = "";
    }

    function guiAnhAvatar(input) {

        if (!input.files ||
            !input.files[0]) return;

        const file =
            input.files[0];

        const reader =
            new FileReader();

        reader.onload = function (e) {

            const img =
                new Image();

            img.onload = function () {

                const canvas =
                    document.createElement("canvas");

                let w = img.width;
                let h = img.height;

                const max = 800;

                if (w > h && w > max) {
                    h = h * max / w;
                    w = max;
                }

                if (h > w && h > max) {
                    w = w * max / h;
                    h = max;
                }

                canvas.width = w;
                canvas.height = h;

                const ctx =
                    canvas.getContext("2d");

                ctx.drawImage(
                    img,
                    0,
                    0,
                    w,
                    h
                );

                const avatar =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.75
                    );

                const oTen =
                    document.getElementById(
                        "o-ten"
                    );

                if (!oTen) return;

                const ten =
                    oTen.value.trim();

                if (!ten) {
                    alert(
                        "Hãy đăng nhập trước khi đổi avatar!"
                    );
                    return;
                }

                localStorage.setItem(
                    keyAvatar(ten),
                    avatar
                );

                nutAvatar.innerHTML =
                    '<img src="' +
                    avatar +
                    '" style="' +
                    'width:28px;' +
                    'height:28px;' +
                    'border-radius:50%;' +
                    'object-fit:cover;">';
            };

            img.src = e.target.result;
        };

        reader.readAsDataURL(file);

        input.value = "";
    }

    nutAvatar.onclick = function () {

        const oTen =
            document.getElementById("o-ten");

        if (!oTen ||
            !oTen.value.trim()) {

            alert(
                "Hãy đăng nhập trước khi đổi avatar!"
            );

            return;
        }

        inputAvatar.click();
    };

    inputAvatar.onchange = function () {
        guiAnhAvatar(this);
    };

    /*
       Gửi tin nhắn mới có avatar.
    */
    window.guiTinNhan =
        guiTinNhanAvatar;

    /*
       Enter: chặn hàm gửi cũ.
    */
    document.addEventListener(
        "keydown",
        function (e) {

            const oNhap =
                document.getElementById("o-nhap");

            if (
                e.target === oNhap &&
                e.key === "Enter"
            ) {

                e.preventDefault();
                e.stopImmediatePropagation();

                guiTinNhanAvatar();
            }

        },
        true
    );

    /*
       Thay listener chat cũ.
    */
    socket.off(
        "nhan_tin_nhan_client"
    );

    socket.on(
        "nhan_tin_nhan_client",
        function (data) {
            hienThiAvatar(data);
        }
    );

    /*
       Lịch sử chat.
    */
    socket.off(
        "tra_lich_su_cho_nguoi_moi"
    );

    socket.on(
        "tra_lich_su_cho_nguoi_moi",
        function (lichSu) {

            const khung =
                document.getElementById(
                    "khung-chat"
                );

            if (!khung) return;

            khung.innerHTML = "";

            if (Array.isArray(lichSu)) {

                lichSu.forEach(
                    function (msg) {
                        hienThiAvatar(msg);
                    }
                );
            }
        }
    );

    function capNhatNutAvatar() {

        const oTen =
            document.getElementById("o-ten");

        if (!oTen) return;

        const ten =
            oTen.value.trim();

        const avatar =
            layAvatar(ten);

        nutAvatar.innerHTML =
            '<img src="' +
            avatar +
            '" style="' +
            'width:28px;' +
            'height:28px;' +
            'border-radius:50%;' +
            'object-fit:cover;">';
    }

    setInterval(
        capNhatNutAvatar,
        500
    );
})();
</script>

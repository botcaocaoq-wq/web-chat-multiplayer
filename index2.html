<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lưới Camera Toàn Phòng</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #111; color: #fff; margin: 0; }
        h3 { text-align: center; color: #00af91; }
        #khoi-camera-phu { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 15px; 
            max-width: 1200px; 
            margin: 20px auto; 
            background: #222; 
            padding: 15px; 
            border-radius: 8px; 
            min-height: 400px; 
        }
        .o-chua-cam-don { position: relative; background: #000; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; aspect-ratio: 16/9; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .video-stream-cam { width: 100%; height: 100%; object-fit: cover; background: #000; }
        .nhan-ten-cam { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.7); padding: 4px 8px; font-size: 13px; border-radius: 4px; color: #fff; font-weight: bold; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <h3>🖥️ HỆ THỐNG HIỂN THỊ STREAM TOÀN PHÒNG CHAT</h3>
    <div id="khoi-camera-phu"></div>

    <script>
        const socket = io();
        const khoiCameraPhu = document.getElementById('khoi-camera-phu');
        let peerConnections = {};
        const rtcConfig = { iceServers: [{ urls: 'stun:://google.com' }] };

        // Đăng nhập ngầm bằng dữ liệu có sẵn để đồng bộ với server
        window.addEventListener('DOMContentLoaded', () => {
            const ten = localStorage.getItem('saved_username');
            const matKhau = localStorage.getItem('saved_password');
            if (ten && matKhau) {
                socket.emit('dang_nhap_he_thong', { ten: ten, matKhau: matKhau }, (res) => {
                    if (res.success) socket.emit('lay_lich_su_khi_vao_sau');
                });
            }
        });

        socket.on('dong_bo_tat_ca_camera_hieng_tai', (danhSachCam) => {
            Object.keys(danhSachCam).forEach(idSocket => {
                thietLapWebRTCPeer(idSocket, danhSachCam[idSocket], true);
            });
        });

        socket.on('co_nguoi_vua_bat_camera', (data) => {
            thietLapWebRTCPeer(data.idSocket, data.ten, false);
        });

        socket.on('co_nguoi_vua_tat_camera', (data) => {
            xoaKhoiVideoElements(data.idSocket);
            if (peerConnections[data.idSocket]) {
                peerConnections[data.idSocket].close();
                delete peerConnections[data.idSocket];
            }
        });

        function thietLapWebRTCPeer(idNguoiNhan, tenNguoiDung, taoOffer) {
            if (peerConnections[idNguoiNhan]) return;
            const pc = new RTCPeerConnection(rtcConfig);
            peerConnections[idNguoiNhan] = pc;

            pc.onicecandidate = (e) => {
                if (e.candidate) socket.emit('rtc_tin_hieu_chuyen_tiep', { to: idNguoiNhan, type: 'candidate', candidate: e.candidate });
            };

            pc.ontrack = (e) => {
                if (e.streams && e.streams[0]) {
                    themKhoiVideoElements(idNguoiNhan, e.streams[0], tenNguoiDung);
                }
            };

            if (taoOffer) {
                pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
                    socket.emit('rtc_tin_hieu_chuyen_tiep', { to: idNguoiNhan, type: 'offer', sdp: pc.localDescription });
                });
            }
        }

        socket.on('rtc_tin_hieu_nhan_ve', async (data) => {
            let pc = peerConnections[data.sender];
            if (!pc) return;
            if (data.type === 'offer') {
                await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                socket.emit('rtc_tin_hieu_chuyen_tiep', { to: data.sender, type: 'answer', sdp: pc.localDescription });
            } else if (data.type === 'answer') {
                await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
            } else if (data.type === 'candidate') {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        function themKhoiVideoElements(id, stream, labelText) {
            if (document.getElementById(id)) {
                document.getElementById(id).querySelector('video').srcObject = stream;
                return;
            }
            const box = document.createElement('div'); box.id = id; box.className = 'o-chua-cam-don';
            const video = document.createElement('video'); video.className = 'video-stream-cam';
            video.autoplay = true; video.playsInline = true; video.srcObject = stream;
            const label = document.createElement('div'); label.className = 'nhan-ten-cam'; label.innerText = labelText;
            box.appendChild(video); box.appendChild(label); khoiCameraPhu.appendChild(box);
        }

        function xoaKhoiVideoElements(id) { const box = document.getElementById(id); if (box) box.remove(); }
    </script>
</body>
</html>

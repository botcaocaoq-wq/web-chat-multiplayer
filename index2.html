<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phòng Chat Stream Màn Hình Siêu Tốc - Canvas Live</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #222; color: #fff; margin: 0; }
        #giao-dien-tong { display: flex; flex-direction: row; gap: 20px; align-items: flex-start; max-width: 1200px; margin: 0 auto; }
        
        #khoi-chat-chinh { width: 422px; }
        #khung-chat { width: 400px; height: 350px; border: 1px solid #555; background: #333; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        #vung-nhap { display: flex; width: 422px; gap: 5px; align-items: center; margin-bottom: 8px; }
        #o-nhap { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #555; background: #444; color: white; border-radius: 4px; }
        
        .nut-tien-ich { padding: 8px 12px; font-size: 18px; color: white; border: none; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        #nut-cong-tac-share { background: #555; }
        #nut-chon-anh { background: #555; }
        #o-chon-anh { display: none; } 
        
        #nut-gui { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007acc; color: white; border: none; border-radius: 4px; }
        #nut-gui:hover { background: #005999; }
        #nut-xoa-man-hinh { padding: 10px 12px; font-size: 16px; background: #e53935; color: white; border: none; border-radius: 4px; cursor: pointer; aspect-ratio: 1/1; }

        #vung-tai-khoan { width: 422px; display: flex; gap: 5px; margin-bottom: 8px; }
        .o-dang-nhap { flex: 1; padding: 8px 10px; font-size: 14px; border: 1px solid #555; background: #444; color: white; border-radius: 4px; }
        #nut-xac-thuc { padding: 8px 12px; font-size: 14px; background: #4caf50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #nut-doi-tk { padding: 8px 12px; font-size: 14px; background: #ff9800; color: black; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; display: none; width: 422px; margin-bottom: 8px; }
        
        .tin-nhan { margin: 5px 0; padding: 5px; background: #444; border-radius: 3px; word-break: break-word; }
        .anh-chat { max-width: 320px; max-height: 320px; border-radius: 5px; margin-top: 5px; display: block; object-fit: contain; }
        #nut-xin-quyen { margin-bottom: 10px; padding: 10px; background: #ff9800; border: none; color: black; font-weight: bold; cursor: pointer; border-radius: 4px; width: 422px; }

        /* LƯỚI KHUNG HÌNH PHẢI: Hiển thị ảnh chụp ghép chuyển động realtime cực nhẹ */
        #khoi-camera-phu { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 15px; 
            flex: 1; 
            padding: 10px; 
            border-radius: 6px;
            min-height: 200px;
        }
        .o-chua-cam-don { position: relative; background: #000; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; aspect-ratio: 16/9; box-shadow: 0 4px 8px rgba(0,0,0,0.4); }
        .anh-stream-live { width: 100%; height: 100%; object-fit: contain; background: #111; }
        .nhan-ten-cam { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.6); padding: 3px 8px; font-size: 12px; border-radius: 4px; color: #fff; font-weight: bold; }

        @media (max-width: 950px) {
            #giao-dien-tong { flex-direction: column !important; width: 100% !important; gap: 15px; }
            #khoi-chat-chinh, #vung-nhap, #vung-tai-khoan, #nut-doi-tk, #nut-xin-quyen { width: 100% !important; max-width: 422px; }
            #khung-chat { width: calc(100% - 22px) !important; max-width: 400px; }
            #khoi-camera-phu { width: 100% !important; grid-template-columns: 1fr !important; }
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <h3>KHUNG TIN NHẮN MULTIPLAYER</h3>
    
    <button id="nut-xin-quyen" onclick="kichHoatChayNgam()">🔔 KÍCH HOẠT NHẬN THÔNG BÁO KHI TẮT WEB</button>
    
    <div id="giao-dien-tong">
        <div id="khoi-chat-chinh">
            <div id="khung-chat"></div>
            <div id="vung-nhap">
                <input type="text" id="o-nhap" placeholder="Nhập tin nhắn..." autocomplete="off" disabled>
                
                <button id="nut-cong-tac-share" class="nut-tien-ich" type="button" onclick="xuLyCongTacShareManHinh()" disabled>🖥️</button>
                
                <button id="nut-chon-anh" class="nut-tien-ich" type="button" onclick="kichHoatOChonAnh()" disabled>📎</button>
                <input type="file" id="o-chon-anh" accept="image/*" onchange="guiAnhTuDong(this)">
                
                <button id="nut-gui" onclick="guiTinNhan()" disabled>Gửi</button>
                <button id="nut-xoa-man-hinh" onclick="xoaSachManHinhTroChuyen()">🧹</button>
            </div>
            <div id="vung-tai-khoan">
                <input type="text" id="o-ten" class="o-dang-nhap" placeholder="Nhập Nickname..." autocomplete="off">
                <input type="password" id="o-mat-khau" class="o-dang-nhap" placeholder="Mật khẩu..." autocomplete="off">
                <button id="nut-xac-thuc" onclick="xuLyXacThucTaiKhoan()">Vào Phòng</button>
            </div>
            <button id="nut-doi-tk" onclick="xuLyDoiTaiKhoan()">🔄 ĐỔI TÀI KHOẢN KHÁC</button>
        </div>

        <div id="khoi-camera-phu"></div>
    </div>

    <!-- Thành phần Canvas ẩn và Video ẩn gánh nhiệm vụ chụp băm nhỏ khung hình -->
    <video id="video-ngam-share" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas-ngam-chup" style="display:none;"></canvas>
    <script>
        const socket = io();
        const khungChat = document.getElementById('khung-chat');
        const oNhap = document.getElementById('o-nhap');
        const oTen = document.getElementById('o-ten');
        const oMatKhau = document.getElementById('o-mat-khau');
        const vungTaiKhoan = document.getElementById('vung-tai-khoan');
        const nutDoiTk = document.getElementById('nut-doi-tk');
        const nutGui = document.getElementById('nut-gui');
        const nutChonAnh = document.getElementById('nut-chon-anh');
        const nutCongTacShare = document.getElementById('nut-cong-tac-share');
        const khoiCameraPhu = document.getElementById('khoi-camera-phu');

        let daDangNhapThanhCong = false;
        let screenStream = null;
        let dangShareManHinh = false;
        let intervalChupAnh = null;

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('saved_username') && localStorage.getItem('saved_password')) {
                oTen.value = localStorage.getItem('saved_username');
                oMatKhau.value = localStorage.getItem('saved_password');
                xuLyXacThucTaiKhoan(); 
            }
        });

        function xuLyXacThucTaiKhoan() {
            const ten = oTen.value.trim();
            const matKhau = oMatKhau.value;
            if(!ten || !matKhau) {
                alert("Vui lòng nhập đầy đủ tài khoản!");
                return;
            }
            socket.emit('dang_nhap_he_thong', { ten: ten, matKhau: matKhau }, (res) => {
                if (res && res.success) {
                    daDangNhapThanhCong = true;
                    oNhap.disabled = false;
                    nutChonAnh.disabled = false;
                    nutCongTacShare.disabled = false;
                    nutGui.disabled = false;
                    vungTaiKhoan.style.display = 'none';
                    nutDoiTk.style.display = 'block';

                    localStorage.setItem('saved_username', ten);
                    localStorage.setItem('saved_password', matKhau);
                    socket.emit('lay_lich_su_khi_vao_sau');
                } else {
                    alert("Đăng nhập thất bại!");
                }
            });
        }

        function xuLyDoiTaiKhoan() {
            localStorage.clear();
            location.reload();
        }

        function kichHoatOChonAnh() { document.getElementById('o-chon-anh').click(); }

        function guiAnhTuDong(input) {
            if (input.files && input.files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const msg = { ten: oTen.value.trim(), loai: 'image', noiDung: e.target.result, thoiGian: Date.now() };
                    socket.emit('gui_tin_nhan_server', msg);
                    hienThiTinNhanLenKhungChat(msg);
                };
                reader.readAsDataURL(input.files);
                input.value = ''; 
            }
        }

        function guiTinNhan() {
            const noiDung = oNhap.value.trim();
            if (!noiDung) return;
            const msg = { ten: oTen.value.trim(), loai: 'text', noiDung: noiDung, thoiGian: Date.now() };
            socket.emit('gui_tin_nhan_server', msg);
            hienThiTinNhanLenKhungChat(msg);
            oNhap.value = '';
        }

        oNhap.addEventListener('keypress', (e) => { if (e.key === 'Enter') guiTinNhan(); });

        function hienThiTinNhanLenKhungChat(data) {
            let mocAn = parseInt(localStorage.getItem('moc_thoi_gian_an_tin_nhan')) || 0;
            if (data.thoiGian < mocAn) return;
            const div = document.createElement('div');
            div.className = 'tin-nhan';
            div.innerHTML = `<strong>${data.ten}:</strong> `;
            if (data.loai === 'image') {
                const img = document.createElement('img'); img.src = data.noiDung; img.className = 'anh-chat';
                div.appendChild(img);
            } else {
                const span = document.createElement('span'); span.innerText = data.noiDung;
                div.appendChild(span);
            }
            khungChat.appendChild(div);
            khungChat.scrollTop = khungChat.scrollHeight;
        }

        socket.on('tra_lich_su_cho_nguoi_moi', (lichSu) => {
            khungChat.innerHTML = '';
            lichSu.forEach(hienThiTinNhanLenKhungChat);
        });

        socket.on('nhan_tin_nhan_client', hienThiTinNhanLenKhungChat);
        function xoaSachManHinhTroChuyen() { localStorage.setItem('moc_thoi_gian_an_tin_nhan', Date.now()); khungChat.innerHTML = ''; }
        // LẮNG NGHE SERVER CHÈN ẢNH CHỤP SẮP XẾP KHUNG HÌNH THEO THỜI GIAN THỰC
        socket.on('rtc_tin_hieu_nhan_ve', (data) => {
            if (data.sender === socket.id) return; // Không vẽ lại màn hình của chính mình từ server đẩy về

            if (data.type === 'frame_image') {
                capNhatHoacTaoKhungAnhLive(data.sender, data.base64, data.label);
            } else if (data.type === 'stop_stream') {
                xoaKhoiVideoElements(data.sender);
            }
        });

        // Tự động xóa màn hình nếu người phát trước đó bị mất kết nối tab
        socket.on('co_nguoi_vua_tat_camera', (data) => {
            xoaKhoiVideoElements(data.idSocket);
        });

        // XỬ LÝ CHIA SẺ: Băm nhỏ màn hình ra thành từng phần ảnh gửi qua server
        async function xuLyCongTacShareManHinh() {
            if (dangShareManHinh) {
                tatSachGiaiPhongStream();
                return;
            }

            try {
                // Gọi màn hình hệ thống
                screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { width: 1280, height: 720, frameRate: 10 } });
                dangShareManHinh = true;
                nutCongTacShare.style.background = '#3949ab'; // Đèn xanh dương báo đang share

                const videoNgam = document.getElementById('video-ngam-share');
                videoNgam.srcObject = screenStream;

                const canvas = document.getElementById('canvas-ngam-chup');
                const ctx = canvas.getContext('2d');

                // Tạo ngay ô xem trước cục bộ trên máy bạn cho bạn kiểm tra
                capNhatHoacTaoKhungAnhLive("my-local-stream", "", "Bạn (Đang chia sẻ màn hình)");
                const anhCucBo = document.getElementById("my-local-stream").querySelector('img');

                // BẮT ĐẦU VÒNG LẶP THỜI GIAN THỰC: Cứ 100 mili giây (0.1 giây) băm nhỏ 1 khung hình gửi đi
                intervalChupAnh = setInterval(() => {
                    if (videoNgam.readyState === videoNgam.HAVE_ENOUGH_DATA) {
                        canvas.width = 640;   // Thu nhỏ kích thước ảnh nén xuống 640x360 để truyền qua mạng Render siêu tốc độ
                        canvas.height = 360;
                        ctx.drawImage(videoNgam, 0, 0, canvas.width, canvas.height);

                        // Xuất ảnh nén JPEG chất lượng 0.4 cực nhẹ giúp chống gián đoạn đường truyền tuyệt đối
                        const chuoiBase64 = canvas.toDataURL('image/jpeg', 0.4);

                        // Vẽ trực tiếp lên màn hình của bạn tại chỗ
                        anhCucBo.src = chuoiBase64;

                        // Bắn mảnh khung hình này qua server truyền thẳng cho mọi người ghép lại
                        socket.emit('rtc_tin_hieu_chuyen_tiep', {
                            to: 'ALL_ROOM', // Gửi quảng bá toàn phòng chat
                            type: 'frame_image',
                            base64: chuoiBase64,
                            label: oTen.value.trim() + " (Màn hình)"
                        });
                    }
                }, 100);

                // Nếu người dùng ấn nút "Stop sharing" mặc định phía trên trình duyệt
                screenStream.getVideoTracks().onended = () => { tatSachGiaiPhongStream(); };

            } catch (err) {
                alert('Không thể kích hoạt chia sẻ màn hình!');
                tatSachGiaiPhongStream();
            }
        }

        function tatSachGiaiPhongStream() {
            if (intervalChupAnh) { clearInterval(intervalChupAnh); intervalChupAnh = null; }
            if (screenStream) { screenStream.getTracks().forEach(track => track.stop()); screenStream = null; }
            
            dangShareManHinh = false;
            nutCongTacShare.style.background = '#555';
            
            xoaKhoiVideoElements("my-local-stream");

            // Phát thông báo gỡ khung hình trên tất cả máy khác
            socket.emit('rtc_tin_hieu_chuyen_tiep', { to: 'ALL_ROOM', type: 'stop_stream' });
            socket.emit('chu_dong_tat_camera_server');
        }

        // Hàm cập nhật ảnh ghép nối tạo chuyển động realtime độc lập từng khung hình một
        function capNhatHoacTaoKhungAnhLive(id, nguonAnhBase64, labelText) {
            const khungSẵnCó = document.getElementById(id);
            if (khungSẵnCó) {
                const img = khungSẵnCó.querySelector('img');
                if (img && nguonAnhBase64) img.src = nguonAnhBase64; // Ghép ảnh mới liên tục vào khung
                return;
            }

            // Tạo khung chứa ảnh chuyển động mới nếu chưa tồn tại
            const box = document.createElement('div'); box.id = id; box.className = 'o-chua-cam-don';
            const img = document.createElement('img'); img.className = 'anh-stream-live';
            if (nguonAnhBase64) img.src = nguonAnhBase64;

            const label = document.createElement('div'); label.className = 'nhan-ten-cam'; label.innerText = labelText;
            box.appendChild(img); box.appendChild(label); khoiCameraPhu.appendChild(box);
        }

        function xoaKhoiVideoElements(id) { const box = document.getElementById(id); if (box) box.remove(); }
        function kichHoatChayNgam() { if ('Notification' in window) Notification.requestPermission(); }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Khung Chat Multiplayer</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #222; color: #fff; }
        #khung-chat { width: 400px; height: 350px; border: 1px solid #555; background: #333; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        
        /* Cấu hình vùng nhập nằm thẳng hàng: Ô nhập -> Nút Chọn ảnh -> Nút Gửi */
        #vung-nhap { display: flex; width: 422px; gap: 5px; align-items: center; }
        #o-nhap { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #555; background: #444; color: white; border-radius: 4px; }
        
        /* Làm đẹp nút chọn ảnh nằm cạnh nút gửi */
        #nhan-chon-anh { padding: 9px 12px; font-size: 18px; background: #555; border-radius: 4px; cursor: pointer; user-select: none; line-height: 1; }
        #nhan-chon-anh:hover { background: #666; }
        #o-chon-anh { display: none; } /* Ẩn nút mặc định xấu xí đi */
        
        #nut-gui { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007acc; color: white; border: none; border-radius: 4px; }
        #nut-gui:hover { background: #005999; }
        
        .tin-nhan { margin: 5px 0; padding: 5px; background: #444; border-radius: 3px; word-break: break-word; }
        
        /* CSS căn chỉnh ảnh to, rõ ràng và nét căng trên cả PC và Điện thoại */
        .anh-chat { max-width: 320px; max-height: 320px; border-radius: 5px; margin-top: 5px; display: block; object-fit: contain; }
        
        #nut-xin-quyen { margin-bottom: 10px; padding: 10px; background: #ff9800; border: none; color: black; font-weight: bold; cursor: pointer; border-radius: 4px; width: 422px; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <h3>KHUNG TIN NHẮN MULTIPLAYER</h3>
    
    <button id="nut-xin-quyen" onclick="kichHoatChayNgam()">🔔 KÍCH HOẠT NHẬN THÔNG BÁO KHI TẮT WEB</button>
    
    <div id="khung-chat"></div>
    
    <div id="vung-nhap">
        <input type="text" id="o-nhap" placeholder="Nhập tin nhắn ở đây..." autocomplete="off">
        
        <!-- Nút kẹp giấy chọn ảnh nằm ngay sát cạnh nút gửi -->
        <label id="nhan-chon-anh" for="o-chon-anh" title="Gửi hình ảnh">📎</label>
        <input type="file" id="o-chon-anh" accept="image/*" onchange="guiAnhTuDong(this)">

        <button id="nut-gui" onclick="guiTinNhan()">Gửi</button>
    </div>

    <script>
        const socket = io();
        const khungChat = document.getElementById('khung-chat');
        const oNhap = document.getElementById('o-nhap');

        async function kichHoatChayNgam() {
            if ('serviceWorker' in navigator && 'PushManager' in window) {
                try {
                    const reg = await navigator.serviceWorker.register('/sw.js');
                    const permission = await Notification.requestPermission();
                    if (permission !== 'granted') { return; }
                    const response = await fetch('/vapid-public-key');
                    const publicKey = await response.text();
                    const sub = await reg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: publicKey
                    });
                    await fetch('/luu-thong-bao', {
                        method: 'POST',
                        body: JSON.stringify(sub),
                        headers: { 'Content-Type': 'application/json' }
                    });
                    alert('Kích hoạt chạy ngầm thành công!');
                    document.getElementById('nut-xin-quyen').style.display = 'none';
                } catch (error) { console.error(error); }
            }
        }

        // Gửi chữ bình thường
        function guiTinNhan() {
            let noiDung = oNhap.value.trim();
            if (noiDung !== "") {
                socket.emit('gui_tin_nhan_mau', { loai: 'chu', noiDung: noiDung });
                oNhap.value = "";
                oNhap.focus();
            }
        }

        // TÍNH NĂNG MỚI: Chọn ảnh một phát là tự động gửi đi luôn không cần bấm nút gửi
        function guiAnhTuDong(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    // Biến ảnh thành chuỗi chữ Base64 rồi tự bắn đi luôn
                    socket.emit('gui_tin_nhan_mau', { loai: 'anh', noiDung: e.target.result });
                    input.value = ""; // Xóa bộ nhớ tạm để có thể chọn lại chính ảnh đó
                };
                reader.readAsDataURL(file);
            }
        }

        oNhap.addEventListener("keypress", function(event) {
            if (event.key === "Enter") { guiTinNhan(); }
        });

        // Nhận dữ liệu phân biệt Chữ hay Ảnh để hiển thị lên khung chat
        socket.on('tin_nhan_moi_tu_server', function(data) {
            let dongTinNhan = document.createElement('div');
            dongTinNhan.className = 'tin-nhan';

            if (data.loai === 'chu') {
                dongTinNhan.innerText = data.noiDung;
            } else if (data.loai === 'anh') {
                // Hiển thị trực tiếp ảnh nét căng vào khung chat y như Zalo
                dongTinNhan.innerHTML = `<span>[Hình ảnh]:</span><img src="${data.noiDung}" class="anh-chat"/>`;
            }

            khungChat.appendChild(dongTinNhan);
            khungChat.scrollTop = khungChat.scrollHeight;

            // Bắn banner thông báo hệ thống ra màn hình
            if (Notification.permission === "granted") {
                new Notification("Phòng Chat Có Tin Nhắn Mới!", {
                    body: data.loai === 'chu' ? data.noiDung : "[Hình ảnh]",
                    icon: "https://flaticon.com"
                });
            }
        });
    </script>
</body>
</html>

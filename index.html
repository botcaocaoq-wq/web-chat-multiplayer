<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Khung Chat Multiplayer</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #222; color: #fff; }
        #khung-chat { width: 400px; height: 300px; border: 1px solid #555; background: #333; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        #vung-nhap { display: flex; width: 422px; gap: 5px; }
        #o-nhap { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #555; background: #444; color: white; border-radius: 4px; }
        #nut-gui { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007acc; color: white; border: none; border-radius: 4px; }
        #nut-gui:hover { background: #005999; }
        .tin-nhan { margin: 5px 0; padding: 5px; background: #444; border-radius: 3px; }
        #nut-xin-quyen { margin-bottom: 10px; padding: 10px; background: #ff9800; border: none; color: black; font-weight: bold; cursor: pointer; border-radius: 4px; width: 422px; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <h3>KHUNG TIN NHẮN MULTIPLAYER</h3>
    
    <!-- Nút bấm xin quyền thông báo hệ thống -->
    <button id="nut-xin-quyen" onclick="xinQuyenThongBao()">🔔 Bấm vào đây để Bật thông báo đẩy</button>
    
    <div id="khung-chat"></div>
    
    <div id="vung-nhap">
        <input type="text" id="o-nhap" placeholder="Nhập tin nhắn ở đây..." autocomplete="off">
        <button id="nut-gui" onclick="guiTinNhan()">Gửi</button>
    </div>

    <script>
        const socket = io();
        const khungChat = document.getElementById('khung-chat');
        const oNhap = document.getElementById('o-nhap');

        // Hàm xin quyền thông báo
        function xinQuyenThongBao() {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    alert("Đã bật thông báo thành công!");
                    document.getElementById('nut-xin-quyen').style.display = 'none';
                }
            });
        }

        if (Notification.permission === "granted") {
            document.getElementById('nut-xin-quyen').style.display = 'none';
        }

        // Hàm gửi tin nhắn đơn giản, không kèm ID loằng ngoằng
        function guiTinNhan() {
            let noiDung = oNhap.value.trim();
            if (noiDung !== "") {
                socket.emit('gui_tin_nhan_mau', noiDung);
                oNhap.value = "";
                oNhap.focus();
            }
        }

        oNhap.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                guiTinNhan();
            }
        });

        // NHẬN TIN NHẮN: Cứ có tin từ server là bắn thông báo thẳng lên màn hình luôn!
        socket.on('tin_nhan_moi_tu_server', function(msg) {
            // 1. Hiện chữ vào khung chat trên web
            let dongTinNhan = document.createElement('div');
            dongTinNhan.className = 'tin-nhan';
            dongTinNhan.innerText = msg;
            khungChat.appendChild(dongTinNhan);
            khungChat.scrollTop = khungChat.scrollHeight;

            // 2. Bắn banner thông báo đen ở góc màn hình máy tính / điện thoại ngay lập tức
            if (Notification.permission === "granted") {
                new Notification("Phòng Chat Có Tin Nhắn Mới!", {
                    body: msg,
                    icon: "https://flaticon.com"
                });
            }
        });
    </script>
</body>
</html>

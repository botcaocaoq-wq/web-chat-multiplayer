<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Khung Chat Multiplayer</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #222; color: #fff; }
        #khung-chat { width: 400px; height: 300px; border: 1px solid #555; background: #333; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        #vung-nhap { display: flex; width: 422px; gap: 5px; flex-direction: column; }
        .hang-nhap { display: flex; gap: 5px; }
        #o-ten { width: 100px; padding: 10px; font-size: 16px; border: 1px solid #555; background: #555; color: white; border-radius: 4px; }
        #o-nhap { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #555; background: #444; color: white; border-radius: 4px; }
        #nut-gui { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007acc; color: white; border: none; border-radius: 4px; }
        #nut-gui:hover { background: #005999; }
        .tin-nhan { margin: 5px 0; padding: 5px; background: #444; border-radius: 3px; }
        .ten-nguoi-gui { color: #00ffb7; font-weight: bold; }
        #nut-xin-quyen { margin-bottom: 10px; padding: 10px; background: #ff9800; border: none; color: black; font-weight: bold; cursor: pointer; border-radius: 4px; width: 422px; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <h3>KHUNG TIN NHẮN MULTIPLAYER</h3>
    
    <button id="nut-xin-quyen" onclick="kichHoatChayNgam()">🔔 KÍCH HOẠT NHẬN THÔNG BÁO KHI TẮT WEB</button>
    
    <div id="khung-chat"></div>
    
    <div id="vung-nhap">
        <div class="hang-nhap">
            <input type="text" id="o-ten" placeholder="Tên bạn" value="Ẩn danh" autocomplete="off">
            <input type="text" id="o-nhap" placeholder="Nhập tin nhắn ở đây..." autocomplete="off">
            <button id="nut-gui" onclick="guiTinNhan()">Gửi</button>
        </div>
    </div>

    <script>
        const socket = io();
        const khungChat = document.getElementById('khung-chat');
        const oNhap = document.getElementById('o-nhap');
        const oTen = document.getElementById('o-ten');

        async function kichHoatChayNgam() {
            if ('serviceWorker' in navigator && 'PushManager' in window) {
                try {
                    const reg = await navigator.serviceWorker.register('/sw.js');
                    const permission = await Notification.requestPermission();
                    if (permission !== 'granted') {
                        alert('Bạn cần cấp quyền thông báo!');
                        return;
                    }
                    const response = await fetch('/vapid-public-key');
                    const publicKey = await response.text();
                    const sub = await reg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: publicKey
                    });
                    await fetch('/luu-thong-bao', {
                        method: 'POST',
                        body: JSON.stringify(sub),
                        headers: { 'Content-Type': 'application/json' }
                    });
                    alert('Kích hoạt thành công!');
                } catch (error) {
                    console.error('Lỗi:', error);
                }
            }
        }

        // Gửi tin nhắn kèm theo số chứng minh thư (socket.id) của chính máy này
        function guiTinNhan() {
            let bieuTen = oTen.value.trim() || "Ẩn danh";
            let noiDung = oNhap.value.trim();
            
            if (noiDung !== "") {
                // SỬA CHÍNH XÁC Ở ĐÂY: Gửi kèm socket.id của thiết bị đang bấm nút gửi
                socket.emit('gui_tin_nhan_mau', { 
                    ten: bieuTen, 
                    chu: noiDung,
                    idSocketNguoiGui: socket.id 
                });

                oNhap.value = "";
                oNhap.focus();
            }
        }

        oNhap.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                guiTinNhan();
            }
        });

        // Nhận dữ liệu tin nhắn mới từ server trả về
        socket.on('tin_nhan_moi_tu_server', function(data) {
            // 1. Vẫn hiển thị dòng chữ vào trong khung chat trên giao diện web
            let dongTinNhan = document.createElement('div');
            dongTinNhan.className = 'tin-nhan';
            dongTinNhan.innerHTML = `<span class="ten-nguoi-gui">[${data.ten}]:</span> ${data.chu}`;
            khungChat.appendChild(dongTinNhan);
            khungChat.scrollTop = khungChat.scrollHeight;

            // 2. CHẶN THÔNG BÁO THEO SỐ CHỨNG MINH THƯ NGẦM (SOCKET ID):
            // CHỈ bật cái bảng thông báo màu đen ở góc màn hình khi: Mã máy gửi KHÁC với Mã máy của bạn hiện tại
            if (data.idSocketNguoiGui !== socket.id) {
                if (Notification.permission === "granted") {
                    new Notification(`Tin nhắn mới từ ${data.ten}`, {
                        body: data.chu,
                        icon: "https://flaticon.com"
                    });
                }
            }
        });
    </script>
</body>
</html>
